<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 米白日系・曼谷旅の手帳</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f2ebe1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .app-container {
      max-width: 400px;
      width: 100%;
      height: 780px;
      background: #fdfaf5;
      border-radius: 42px;
      box-shadow: 0 20px 40px rgba(200, 170, 150, 0.25), 0 8px 16px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 2px solid #f0e4d8;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px 6px;
      font-size: 12px;
      color: #b89a8a;
      font-weight: 500;
      background: #fdfaf5;
    }

    .app-header {
      padding: 8px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #f0d9cc;
      background: #fdfaf5;
    }

    .app-header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #c96b8a;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-header h1 span {
      font-size: 22px;
    }

    .save-indicator {
      font-size: 10px;
      color: #b0a0a6;
      background: #f2e6de;
      padding: 4px 10px;
      border-radius: 20px;
      transition: 0.3s;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 20px;
      background: #fdfaf5;
      scrollbar-width: thin;
      scrollbar-color: #f0c8b8 #f5ece2;
    }

    .main-content::-webkit-scrollbar { width: 5px; }
    .main-content::-webkit-scrollbar-thumb { background: #f0c8b8; border-radius: 10px; }

    .card {
      background: #ffffff;
      border-radius: 26px;
      padding: 18px 18px;
      margin-bottom: 18px;
      box-shadow: 0 6px 18px rgba(220, 190, 170, 0.18), 0 2px 6px rgba(230, 200, 180, 0.12);
      border: 1px solid #f0e4d8;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #b85c7a;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 2px dotted #f0d9cc;
    }

    .card-title i { font-size: 20px; }

    button, .btn {
      background: #ffb6c9;
      border: none;
      border-radius: 30px;
      padding: 8px 16px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(255, 150, 180, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      letter-spacing: 0.3px;
    }

    button:active { transform: scale(0.96); background: #f79eb6; }

    button.secondary {
      background: #f5ece2;
      color: #b85c7a;
      box-shadow: 0 2px 6px rgba(230, 200, 180, 0.4);
    }

    button.small { padding: 5px 10px; font-size: 11px; }

    .day-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .day-tab {
      background: #faf5ee;
      border: 1.5px solid #f0d9cc;
      color: #b85c7a;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .day-tab.active {
      background: #ffb6c9;
      border-color: #ffb6c9;
      color: white;
      box-shadow: 0 4px 8px rgba(255, 140, 170, 0.4);
    }

    .itinerary-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .itinerary-item {
      background: #faf7f1;
      border-radius: 18px;
      padding: 12px 14px;
      border-left: 6px solid #ffb6c9;
      font-size: 13px;
      color: #5e4a52;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(230, 210, 190, 0.3);
    }

    .itinerary-item .place {
      font-weight: 600;
      color: #a0526e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      line-height: 1.35;
    }

    .itinerary-item .transport {
      font-size: 11px;
      color: #b08a95;
      background: #f5ece2;
      padding: 4px 8px;
      border-radius: 12px;
      margin-top: 4px;
      display: inline-block;
      width: fit-content;
      line-height: 1.5;
    }

    .map-link {
      font-size: 11px;
      color: #e06b8e;
      text-decoration: none;
      background: #ffe2eb;
      padding: 3px 10px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      transition: 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .map-link:active { background: #ffb6c9; color: white; }

    input, select, textarea {
      background: #faf6f0;
      border: 1.5px solid #f0ddd2;
      border-radius: 30px;
      padding: 10px 14px;
      font-size: 13px;
      width: 100%;
      outline: none;
      color: #4f3a42;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #ffb6c9;
      background: #ffffff;
    }

    label {
      font-size: 12px;
      color: #b85c7a;
      margin-bottom: 4px;
      display: block;
      font-weight: 500;
    }

    .form-row { margin-bottom: 12px; }

    .flex-row { display: flex; gap: 8px; align-items: center; }
    .flex-row > * { flex: 1; }

    .expense-item {
      background: #faf7f1;
      border-radius: 20px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #f0e4d8;
      font-size: 13px;
    }

    .expense-item.settled {
      opacity: 0.6;
      text-decoration: line-through;
      background: #f3ede6;
    }

    .expense-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .expense-name { font-weight: 600; color: #b85c7a; }
    .expense-amount { font-weight: 600; color: #e06b8e; }
    .expense-detail { font-size: 11px; color: #937a83; margin-bottom: 4px; }
    .expense-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }

    .settle-card {
      background: #faf3ec;
      border-radius: 18px;
      padding: 12px;
      margin-top: 10px;
      font-size: 13px;
      border: 1px dashed #ffb6c9;
    }

    .rate-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .rate-row input { text-align: center; }
    .rate-arrow { color: #ffb6c9; font-weight: 600; font-size: 18px; }

    .hidden { display: none !important; }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      background: #fdfaf5;
      border-top: 2px solid #f0e4d8;
      border-radius: 0 0 42px 42px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 9px;
      color: #b89a8a;
      background: none;
      border: none;
      padding: 4px 6px;
      border-radius: 20px;
      box-shadow: none;
    }

    .nav-item.active {
      color: #e06b8e;
      font-weight: 600;
      background: #f7ede4;
    }

    .nav-item i { font-size: 19px; line-height: 1; }
    .nav-item:active { transform: scale(0.94); background: #f5ece2; }

    .hint {
      font-size: 10px;
      color: #b0a0a6;
      text-align: center;
      margin-top: 4px;
    }

    .current-day-label {
      font-size: 11px;
      color: #b08a95;
      background: #faf3ec;
      border-radius: 14px;
      padding: 5px 10px;
      margin-bottom: 10px;
      display: inline-block;
    }

    /* 文件列表 */
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #faf7f1;
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #f0e4d8;
    }

    .file-thumb {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #f5ece2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .file-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    .file-info { flex: 1; min-width: 0; }

    .file-name {
      font-size: 12px;
      font-weight: 600;
      color: #a0526e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 10px;
      color: #b08a95;
      margin-top: 2px;
    }

    .file-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .upload-zone {
      border: 2px dashed #f0d9cc;
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      background: #faf7f1;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-zone:active { background: #f5ece2; }

    .upload-zone .up-icon { font-size: 32px; }
    .upload-zone .up-title { font-size: 13px; color: #b85c7a; font-weight: 600; margin-top: 6px; }
    .upload-zone .up-sub { font-size: 11px; color: #b08a95; margin-top: 4px; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="status-bar">
    <span>🇹🇭 曼谷 2026</span>
    <span id="saveStatus">已儲存</span>
  </div>

  <div class="app-header">
    <h1><span>🧸</span> 曼谷旅帳</h1>
    <div class="save-indicator" id="syncIndicator">🔄 自動儲存</div>
  </div>

  <div class="main-content" id="mainContent">
    <!-- 行程表 -->
    <div id="tab-itinerary" class="tab-pane">
      <div class="card">
        <div class="card-title"><i>📅</i> 每日行程</div>
        <div class="day-tabs" id="dayTabsContainer"></div>
        <div class="flex-row" style="margin-bottom: 12px;">
          <input type="text" id="newDayName" placeholder="新日期 e.g. Day 6｜12/02" style="flex:2;">
          <button class="small" id="addDayBtn" style="flex:1;">+ 新增</button>
        </div>
        <div id="itineraryList" class="itinerary-list"></div>
      </div>
      <div class="card">
        <div class="card-title"><i>➕</i> 新增行程</div>
        <div class="current-day-label" id="currentDayLabel">加入至：—</div>
        <div class="form-row">
          <label>地點名稱</label>
          <input type="text" id="placeName" placeholder="例：ICONSIAM">
        </div>
        <div class="form-row">
          <label>Google 地圖導航連結 (可貼上網址)</label>
          <input type="text" id="placeMapUrl" placeholder="https://www.google.com/maps/search/?api=1&query=...">
        </div>
        <div class="form-row">
          <label>交通說明 (精確到出口)</label>
          <input type="text" id="placeTransport" placeholder="例：BTS Chit Lom 站 2 號出口步行 5 分鐘">
        </div>
        <button id="addItineraryBtn" style="width:100%;">✨ 加入行程</button>
      </div>
    </div>

    <!-- 地圖 -->
    <div id="tab-map" class="tab-pane hidden">
      <div class="card">
        <div class="card-title"><i>🗺️</i> 地圖與交通</div>
        <p style="font-size:12px; color:#b08a95; margin-bottom:12px;">每個行程均附 Google 地圖連結，點擊即可導航</p>
        <div id="mapItineraryList" class="itinerary-list"></div>
      </div>
    </div>

    <!-- 記帳 -->
    <div id="tab-expense" class="tab-pane hidden">
      <div class="card">
        <div class="card-title"><i>💰</i> 新增支出</div>
        <div class="form-row">
          <label>項目名稱</label>
          <input type="text" id="expenseName" placeholder="例：午餐壽司">
        </div>
        <div class="form-row">
          <label>總金額</label>
          <input type="number" id="expenseTotal" placeholder="0" step="0.01">
        </div>
        <div class="flex-row">
          <div style="flex:1">
            <label>幣種</label>
            <select id="expenseCurrency">
              <option value="THB">泰銖 (THB)</option>
              <option value="HKD">港幣 (HKD)</option>
            </select>
          </div>
          <div style="flex:1">
            <label>付款方式</label>
            <select id="expensePayMethod">
              <option value="現金">現金</option>
              <option value="信用卡">信用卡</option>
              <option value="轉帳">轉帳</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>參與人數 (總人數)</label>
          <input type="number" id="expenseParticipants" value="2" min="1">
        </div>
        <div class="form-row">
          <label>誰負責付款 (人名)</label>
          <input type="text" id="expensePayer" placeholder="例：A">
        </div>
        <div class="form-row">
          <label>分攤方式</label>
          <select id="splitType">
            <option value="equal">人均 (總額 / 人數)</option>
            <option value="custom">分開付 (手動輸入每人金額)</option>
          </select>
        </div>
        <div id="customSplitContainer" class="hidden">
          <label>參與人名與金額 (每行一組: 人名,金額)</label>
          <textarea id="customSplitInput" rows="2" placeholder="A,2500&#10;B,2500"></textarea>
        </div>
        <button id="addExpenseBtn" style="width:100%; margin-top:8px;">📝 新增支出</button>
      </div>

      <div class="card">
        <div class="card-title"><i>🧾</i> 支出列表 & 結算</div>
        <div id="expenseList"></div>
        <button id="settleAllBtn" class="secondary" style="width:100%; margin-top:12px;">💸 統一結清 (未結清項目)</button>
        <div id="settlementResult" class="settle-card" style="margin-top:12px;"></div>
        <div id="settlementHistory" style="margin-top:12px;"></div>
      </div>
    </div>

    <!-- 匯率 -->
    <div id="tab-rate" class="tab-pane hidden">
      <div class="card">
        <div class="card-title"><i>💱</i> 日圓 ↔ 港幣 換算</div>
        <div class="rate-row">
          <span style="font-size:14px;">🇯🇵 JPY</span>
          <input type="number" id="jpyInput" placeholder="日圓" step="0.01">
          <span class="rate-arrow">⇄</span>
          <span style="font-size:14px;">🇭🇰 HKD</span>
        </div>
        <div class="rate-row">
          <input type="number" id="hkdInput" placeholder="港幣" step="0.01">
        </div>
        <div class="form-row" style="margin-top:12px;">
          <label>匯率設定 (1 HKD = ? JPY)</label>
          <input type="number" id="rateSetting" value="20.5" step="0.01">
          <p class="hint" style="text-align:left; margin-top:4px;">預設 1 HKD = 20.5 JPY</p>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i>📊</i> 目前匯率</div>
        <p style="font-size:14px; color:#b85c7a; text-align:center;" id="currentRateDisplay">1 HKD = 20.5 JPY</p>
      </div>
    </div>

    <!-- 文件 -->
    <div id="tab-files" class="tab-pane hidden">
      <div class="card">
        <div class="card-title"><i>📁</i> 上載截圖 / 文件</div>
        <div class="upload-zone" id="uploadZone">
          <div class="up-icon">📤</div>
          <div class="up-title">撳一下選擇檔案</div>
          <div class="up-sub">支援 PDF、JPG、PNG 等圖片・可一次選多個</div>
        </div>
        <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none;">
        <p class="hint" style="margin-top:8px;">單一檔案上限 20MB，檔案儲存在此瀏覽器</p>
      </div>

      <div class="card">
        <div class="card-title"><i>🗂️</i> 已上載文件</div>
        <div id="fileList"></div>
      </div>
    </div>
  </div>

  <!-- 底部導航 -->
  <div class="bottom-nav">
    <button class="nav-item active" data-tab="itinerary"><i>📅</i> 行程</button>
    <button class="nav-item" data-tab="map"><i>🗺️</i> 地圖</button>
    <button class="nav-item" data-tab="expense"><i>💰</i> 記帳</button>
    <button class="nav-item" data-tab="rate"><i>💱</i> 匯率</button>
    <button class="nav-item" data-tab="files"><i>📁</i> 文件</button>
  </div>
</div>

<script>
  // ---------- 曼谷 2026 預設行程 ----------
  const MAP_SEARCH = 'https://www.google.com/maps/search/?api=1&query=';

  const BANGKOK_DAYS = [
    {
      name: 'Day 0｜11/26',
      items: [
        { place: '素萬那普機場 Suvarnabhumi Airport（23:15 抵達 EK385）', mapUrl: MAP_SEARCH + 'Suvarnabhumi+Airport+Bangkok', transport: '抵達後通關取行李，前往酒店 Check-in' },
        { place: 'Cross Vibe Bangkok Sukhumvit（BTS On Nut）', mapUrl: MAP_SEARCH + 'Cross+Vibe+Bangkok+Sukhumvit', transport: 'Airport Rail Link 至 Phaya Thai 轉 BTS 至 On Nut 站 3 號出口；或 Grab 直達約 30–40 分鐘' }
      ]
    },
    {
      name: 'Day 1｜11/27',
      items: [
        { place: 'QSNCC 領取選手包（12:00–15:00）', mapUrl: MAP_SEARCH + 'Queen+Sirikit+National+Convention+Centre+Bangkok', transport: 'MRT Queen Sirikit National Convention Centre 站 3 號出口，步行約 3 分鐘' },
        { place: 'CentralWorld / Chit Lom 逛街（15:30–19:00）', mapUrl: MAP_SEARCH + 'CentralWorld+Bangkok', transport: 'BTS Chit Lom 站 2 號出口，沿 Skywalk 步行約 5 分鐘｜推薦 Zara、Uniqlo、H&M' },
        { place: 'Asok 一帶晚餐', mapUrl: MAP_SEARCH + 'Terminal+21+Asok+Bangkok', transport: 'BTS Asok 站 3 號出口／MRT Sukhumvit 站 3 號出口步行 2 分鐘｜推薦 Pad Thai、Mango Sticky Rice' }
      ]
    },
    {
      name: 'Day 2｜11/28',
      items: [
        { place: 'ICONSIAM 逛街 + 河畔（10:00–16:00）', mapUrl: MAP_SEARCH + 'ICONSIAM+Bangkok', transport: 'BTS Saphan Taksin 站 2 號出口 → 轉 Gold Line 至 Charoen Nakhon 站 1 號出口｜推薦 LV、Gucci、Apple、Thai brands' },
        { place: '河畔散步拍照（16:00–18:00）', mapUrl: MAP_SEARCH + 'ICONSIAM+River+Park+Bangkok', transport: 'ICONSIAM 河濱公園 River Park 沿昭披耶河步道漫步' },
        { place: 'Tichuca Rooftop Bar 屋頂酒吧', mapUrl: MAP_SEARCH + 'Tichuca+Rooftop+Bar+Bangkok', transport: 'BTS Thong Lo 站 3 號出口步行約 8 分鐘，T-One Building 46 樓' }
      ]
    },
    {
      name: 'Day 3｜11/29',
      items: [
        { place: 'Sanam Luang 10K 馬拉松（06:00–08:30）', mapUrl: MAP_SEARCH + 'Sanam+Luang+Bangkok', transport: '04:30–05:30 出發建議 Grab 直達；或 MRT Sanam Chai 站 1 號出口步行約 10 分鐘' },
        { place: 'Makkha Health & Spa 按摩恢復（下午）', mapUrl: MAP_SEARCH + 'Makkha+Health+and+Spa+Bangkok', transport: 'BTS Asok 站 4 號出口步行約 5 分鐘｜推薦 Thai Massage、Aroma Oil、Head Spa' },
        { place: 'Copper Beyond Buffet（Gaysorn Amarin）晚餐', mapUrl: MAP_SEARCH + 'Copper+Beyond+Buffet+Gaysorn+Amarin+Bangkok', transport: 'BTS Chit Lom 站 1 號出口，經 Skywalk 直達 Gaysorn Amarin 4 樓｜需提前預約' }
      ]
    },
    {
      name: 'Day 4｜11/30',
      items: [
        { place: 'SANGARUN.THAI COSTUME 泰服體驗（09:00–13:00）', mapUrl: MAP_SEARCH + 'Sangarun+Thai+Costume+Bangkok', transport: 'BTS Saphan Taksin 站 2 號出口 → 搭船至 Tha Tien 碼頭，步行約 5 分鐘（Wat Arun 附近）' },
        { place: '鄭王廟 Wat Arun 探索拍照（下午）', mapUrl: MAP_SEARCH + 'Wat+Arun+Bangkok', transport: 'Tha Tien 碼頭搭渡船至 Wat Arun 碼頭，船程約 5 分鐘' }
      ]
    },
    {
      name: 'Day 5｜12/01',
      items: [
        { place: '素萬那普機場（回程 13:45 EK384）', mapUrl: MAP_SEARCH + 'Suvarnabhumi+Airport+Bangkok', transport: '約 11:00 退房出發，BTS On Nut → Phaya Thai 轉 Airport Rail Link；或 Grab 約 40 分鐘' }
      ]
    }
  ];

  // ---------- 資料 ----------
  const STORAGE_KEY = 'pinkTravelAppData_v2';
  const LEGACY_KEY = 'pinkTravelAppData';

  let appData = {
    days: [],
    currentDay: '',
    expenses: [],
    settlementHistory: [],
    files: [],
    rate: 20.5,
    activeTab: 'itinerary'
  };

  let rateSaveTimer = null;
  const fileUrlCache = new Map(); // id -> objectURL

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  // ---------- IndexedDB 檔案儲存 ----------
  const DB_NAME = 'travelAppFilesDB';
  const DB_STORE = 'files';

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('瀏覽器不支援 IndexedDB'));
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }

  async function saveFileToDB(id, blob) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(blob, id);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  }

  async function getFileFromDB(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e.target.error);
    });
  }

  async function deleteFileFromDB(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  }

  async function getFileObjectURL(meta) {
    if (fileUrlCache.has(meta.id)) return fileUrlCache.get(meta.id);
    try {
      const blob = await getFileFromDB(meta.id);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      fileUrlCache.set(meta.id, url);
      return url;
    } catch (e) {
      console.warn('讀取檔案失敗', e);
      return null;
    }
  }

  // ---------- 載入 / 儲存 ----------
  function loadData() {
    const stored = localStorage.getItem(STORAGE_KEY);

    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        appData = { ...appData, ...parsed };
      } catch (e) { console.warn('載入失敗', e); }

      if (!Array.isArray(appData.days)) appData.days = [];
      if (!Array.isArray(appData.expenses)) appData.expenses = [];
      if (!Array.isArray(appData.settlementHistory)) appData.settlementHistory = [];
      if (!Array.isArray(appData.files)) appData.files = [];
      if (!appData.rate || isNaN(appData.rate)) appData.rate = 20.5;

      if (appData.days.length === 0) {
        appData.days = clone(BANGKOK_DAYS);
        appData.currentDay = appData.days[0].name;
      }
      if (!appData.currentDay || !appData.days.some(d => d.name === appData.currentDay)) {
        appData.currentDay = appData.days[0].name;
      }
      renderAll();
    } else {
      let legacy = null;
      try {
        const raw = localStorage.getItem(LEGACY_KEY);
        if (raw) legacy = JSON.parse(raw);
      } catch (e) { /* ignore */ }

      appData.days = clone(BANGKOK_DAYS);
      appData.currentDay = appData.days[0].name;
      appData.activeTab = 'itinerary';
      appData.rate = (legacy && legacy.rate) ? legacy.rate : 20.5;
      appData.files = [];
      appData.expenses = (legacy && Array.isArray(legacy.expenses) && legacy.expenses.length)
        ? legacy.expenses
        : [
            { id: Date.now() + 1, name: '午餐壽司', total: 5000, currency: 'THB', payMethod: '現金', participants: 2, payer: 'A', splitType: 'custom', customSplit: [{ name: 'A', amount: 2500 }, { name: 'B', amount: 2500 }], settled: false, settledAt: '' },
            { id: Date.now() + 2, name: '晚餐燒肉', total: 6000, currency: 'THB', payMethod: '信用卡', participants: 2, payer: 'B', splitType: 'custom', customSplit: [{ name: 'A', amount: 3000 }, { name: 'B', amount: 3000 }], settled: false, settledAt: '' }
          ];
      appData.settlementHistory = (legacy && Array.isArray(legacy.settlementHistory)) ? legacy.settlementHistory : [];

      saveData();
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    } catch (e) { console.warn('儲存失敗', e); }

    const statusEl = document.getElementById('saveStatus');
    const syncEl = document.getElementById('syncIndicator');
    if (statusEl) statusEl.innerText = '已儲存 ✓';
    if (syncEl) {
      syncEl.innerText = '💾 儲存中…';
      setTimeout(() => { syncEl.innerText = '🔄 自動儲存'; }, 600);
    }
    renderAll();
  }

  // ---------- 行程 ----------
  function renderDayTabs() {
    const container = document.getElementById('dayTabsContainer');
    if (!container) return;
    container.innerHTML = '';
    if (!appData.days.length) {
      container.innerHTML = '<span style="font-size:12px;color:#b08a95;">尚無日期，請新增</span>';
      return;
    }
    appData.days.forEach(day => {
      const btn = document.createElement('button');
      btn.className = `day-tab ${appData.currentDay === day.name ? 'active' : ''}`;
      btn.textContent = day.name;
      btn.onclick = () => { appData.currentDay = day.name; saveData(); };
      container.appendChild(btn);
    });
    const label = document.getElementById('currentDayLabel');
    if (label) label.textContent = '加入至：' + (appData.currentDay || '—');
  }

  function buildItineraryItemHTML(item, mapText) {
    const url = item.mapUrl || '#';
    return `
      <div class="place">
        <span>📍 ${item.place}</span>
        <a class="map-link" href="${url}" target="_blank" rel="noopener">🗺️ ${mapText}</a>
      </div>
      <div class="transport">🚇 ${item.transport || '無交通說明'}</div>
    `;
  }

  function renderItineraryList() {
    const container = document.getElementById('itineraryList');
    const mapContainer = document.getElementById('mapItineraryList');
    if (!container || !mapContainer) return;
    container.innerHTML = '';
    mapContainer.innerHTML = '';

    const current = appData.days.find(d => d.name === appData.currentDay);
    if (!current || current.items.length === 0) {
      container.innerHTML = '<p style="font-size:13px;color:#b08a95;text-align:center;">✨ 尚無行程，快新增吧</p>';
      mapContainer.innerHTML = '<p style="font-size:13px;color:#b08a95;text-align:center;">✨ 尚無地點</p>';
      return;
    }
    current.items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'itinerary-item';
      div.innerHTML = buildItineraryItemHTML(item, '導航');
      container.appendChild(div);

      const mapDiv = document.createElement('div');
      mapDiv.className = 'itinerary-item';
      mapDiv.innerHTML = buildItineraryItemHTML(item, '開啟地圖');
      mapContainer.appendChild(mapDiv);
    });
  }

  // ---------- 記帳 ----------
  function renderExpenses() {
    const container = document.getElementById('expenseList');
    if (!container) return;
    container.innerHTML = '';
    if (!appData.expenses.length) {
      container.innerHTML = '<p style="font-size:13px;color:#b08a95;text-align:center;">尚無記帳項目</p>';
      return;
    }
    appData.expenses.forEach(exp => {
      const div = document.createElement('div');
      div.className = `expense-item ${exp.settled ? 'settled' : ''}`;
      let splitDetail = exp.splitType === 'equal'
        ? `人均 ${(exp.total / exp.participants).toFixed(2)} ${exp.currency}`
        : (exp.customSplit || []).map(s => `${s.name}: ${s.amount}`).join(', ') + ` ${exp.currency}`;

      div.innerHTML = `
        <div class="expense-header">
          <span class="expense-name">${exp.name} ${exp.settled ? '✅' : ''}</span>
          <span class="expense-amount">${exp.total} ${exp.currency}</span>
        </div>
        <div class="expense-detail">付款人：${exp.payer}｜${splitDetail}｜${exp.payMethod}</div>
        <div class="expense-actions">
          <button class="small secondary" onclick="toggleSettle(${exp.id})">${exp.settled ? '取消結清' : '標記結清'}</button>
          <button class="small secondary" onclick="deleteExpense(${exp.id})">刪除</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  window.toggleSettle = function(id) {
    const exp = appData.expenses.find(e => e.id === id);
    if (exp) {
      exp.settled = !exp.settled;
      exp.settledAt = exp.settled ? new Date().toLocaleString('zh-HK') : '';
      saveData();
    }
  };

  window.deleteExpense = function(id) {
    if (confirm('確定刪除此項目？')) {
      appData.expenses = appData.expenses.filter(e => e.id !== id);
      saveData();
    }
  };

  function settleAll() {
    const unsettled = appData.expenses.filter(e => !e.settled);
    const resultEl = document.getElementById('settlementResult');
    if (!unsettled.length) {
      resultEl.innerHTML = '<p>沒有未結清的項目</p>';
      return;
    }

    const balances = {};
    unsettled.forEach(exp => {
      const cur = exp.currency;
      if (!balances[exp.payer]) balances[exp.payer] = { THB: 0, HKD: 0 };
      balances[exp.payer][cur] += exp.total;
      (exp.customSplit || []).forEach(s => {
        if (!balances[s.name]) balances[s.name] = { THB: 0, HKD: 0 };
        balances[s.name][cur] -= s.amount;
      });
    });

    const debtors = [], creditors = [];
    Object.entries(balances).forEach(([name, bal]) => {
      ['THB', 'HKD'].forEach(cur => {
        const amt = bal[cur];
        if (amt > 0.01) creditors.push({ name, cur, amount: amt });
        else if (amt < -0.01) debtors.push({ name, cur, amount: -amt });
      });
    });

    let resultHtml = '<h4 style="font-size:14px; margin-bottom:8px;">💡 結算結果</h4>';
    const detailsText = [];

    if (!debtors.length && !creditors.length) {
      resultHtml += '<p>所有帳目已平衡</p>';
      detailsText.push('所有帳目已平衡');
    } else {
      debtors.forEach(d => {
        creditors.forEach(c => {
          if (d.cur === c.cur && d.amount > 0.01 && c.amount > 0.01) {
            const pay = Math.min(d.amount, c.amount);
            if (pay > 0.01) {
              const line = `${d.name} 應該付 ${c.name} ${pay.toFixed(2)} ${d.cur}`;
              resultHtml += `<p>${line}</p>`;
              detailsText.push(line);
              d.amount -= pay;
              c.amount -= pay;
            }
          }
        });
      });
    }

    const now = new Date().toLocaleString('zh-HK');
    unsettled.forEach(exp => { exp.settled = true; exp.settledAt = now; });
    appData.settlementHistory.push({
      date: now,
      details: detailsText.length ? detailsText.join('；') : '無差額',
      html: resultHtml
    });

    resultEl.innerHTML = resultHtml;
    saveData();
  }

  function renderHistory() {
    const container = document.getElementById('settlementHistory');
    if (!container) return;
    if (!appData.settlementHistory.length) { container.innerHTML = ''; return; }
    let html = '<h4 style="font-size:14px; margin-bottom:8px;">📜 結清記錄</h4>';
    appData.settlementHistory.forEach(h => {
      const content = h.html || (h.details || '');
      html += `
        <div style="background:#fff; border-radius:12px; padding:10px; margin-bottom:8px; font-size:12px; border:1px solid #f0e4d8;">
          <div style="color:#b89a8a; margin-bottom:4px;">🕒 ${h.date}</div>
          <div>${content}</div>
        </div>`;
    });
    container.innerHTML = html;
  }

  // ---------- 匯率 ----------
  function updateRateDisplay() {
    const el = document.getElementById('currentRateDisplay');
    if (el) el.innerText = `1 HKD = ${appData.rate} JPY`;
  }

  function initRateInputs() {
    const rateInput = document.getElementById('rateSetting');
    if (rateInput) rateInput.value = appData.rate;
    const jpyInput = document.getElementById('jpyInput');
    const hkdInput = document.getElementById('hkdInput');

    if (jpyInput) {
      jpyInput.addEventListener('input', function() {
        const jpy = parseFloat(this.value);
        hkdInput.value = !isNaN(jpy) ? (jpy / appData.rate).toFixed(2) : '';
      });
    }
    if (hkdInput) {
      hkdInput.addEventListener('input', function() {
        const hkd = parseFloat(this.value);
        jpyInput.value = !isNaN(hkd) ? (hkd * appData.rate).toFixed(2) : '';
      });
    }
    if (rateInput) {
      rateInput.addEventListener('input', function() {
        const v = parseFloat(this.value);
        if (!isNaN(v) && v > 0) {
          appData.rate = v;
          updateRateDisplay();
          clearTimeout(rateSaveTimer);
          rateSaveTimer = setTimeout(() => saveData(), 500);
        }
      });
    }
  }

  // ---------- 分頁 ----------
  function switchTab(tabId) {
    appData.activeTab = tabId;
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
    const target = document.getElementById(`tab-${tabId}`);
    if (target) target.classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabId);
    });
    saveData();
  }

  // ---------- 新增行程 / 支出 ----------
  function addItinerary() {
    const placeEl = document.getElementById('placeName');
    const mapEl = document.getElementById('placeMapUrl');
    const transportEl = document.getElementById('placeTransport');
    const place = placeEl.value.trim();
    const mapUrl = mapEl.value.trim();
    const transport = transportEl.value.trim();
    if (!place) return alert('請輸入地點名稱');

    let day = appData.days.find(d => d.name === appData.currentDay);
    if (!day) {
      day = { name: appData.currentDay || 'Day 1', items: [] };
      appData.days.push(day);
      appData.currentDay = day.name;
    }
    day.items.push({ place, mapUrl, transport });
    placeEl.value = ''; mapEl.value = ''; transportEl.value = '';
    saveData();
  }

  function addExpense() {
    const name = document.getElementById('expenseName').value.trim();
    const total = parseFloat(document.getElementById('expenseTotal').value);
    const currency = document.getElementById('expenseCurrency').value;
    const payMethod = document.getElementById('expensePayMethod').value;
    const participants = parseInt(document.getElementById('expenseParticipants').value) || 1;
    const payer = document.getElementById('expensePayer').value.trim();
    const splitType = document.getElementById('splitType').value;

    if (!name || isNaN(total) || total <= 0 || !payer) {
      return alert('請填寫項目名稱、正確金額和付款人');
    }

    let customSplit = [];
    if (splitType === 'custom') {
      const raw = document.getElementById('customSplitInput').value.trim();
      if (!raw) return alert('請輸入分開付的人名與金額');
      for (const line of raw.split('\n')) {
        if (!line.trim()) continue;
        const parts = line.split(',');
        if (parts.length < 2) return alert('格式錯誤，請使用「人名,金額」');
        const pName = parts[0].trim();
        const amt = parseFloat(parts[1].trim());
        if (!pName || isNaN(amt)) return alert('格式錯誤，請使用「人名,金額」');
        customSplit.push({ name: pName, amount: amt });
      }
    } else {
      const namesRaw = prompt('請輸入參與者名字（逗號分隔），例如：A,B', 'A,B');
      if (!namesRaw) return;
      const names = namesRaw.split(',').map(s => s.trim()).filter(Boolean);
      if (names.length !== participants) {
        if (!confirm(`參與人數為 ${participants}，但輸入了 ${names.length} 個名字，仍要繼續嗎？`)) return;
      }
      const per = total / participants;
      customSplit = names.map(n => ({ name: n, amount: per }));
    }

    appData.expenses.push({
      id: Date.now(), name, total, currency, payMethod,
      participants, payer, splitType, customSplit,
      settled: false, settledAt: ''
    });

    document.getElementById('expenseName').value = '';
    document.getElementById('expenseTotal').value = '';
    document.getElementById('customSplitInput').value = '';
    saveData();
  }

  // ---------- 文件 ----------
  function formatSize(bytes) {
    if (!bytes || bytes <= 0) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }

  function renderFiles() {
    const container = document.getElementById('fileList');
    if (!container) return;
    container.innerHTML = '';
    if (!appData.files.length) {
      container.innerHTML = '<p style="font-size:13px;color:#b08a95;text-align:center;">尚未上載文件</p>';
      return;
    }

    appData.files.slice().reverse().forEach(f => {
      const isImage = (f.type || '').startsWith('image/');
      const isPDF = (f.type === 'application/pdf') || (f.name || '').toLowerCase().endsWith('.pdf');
      const icon = isImage ? '🖼️' : (isPDF ? '📄' : '📎');

      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `
        <div class="file-thumb" id="thumb_${f.id}">${icon}</div>
        <div class="file-info">
          <div class="file-name" title="${f.name}">${f.name}</div>
          <div class="file-meta">${formatSize(f.size)}・${f.uploadedAt}</div>
        </div>
        <div class="file-actions">
          <button class="small secondary" onclick="previewFile('${f.id}')">查看</button>
          <button class="small secondary" onclick="deleteFile('${f.id}')">刪除</button>
        </div>
      `;
      container.appendChild(div);

      if (isImage) {
        getFileObjectURL(f).then(url => {
          if (!url) return;
          const thumb = document.getElementById('thumb_' + f.id);
          if (thumb) {
            thumb.innerHTML = '';
            const img = document.createElement('img');
            img.src = url;
            img.className = 'file-thumb-img';
            img.alt = f.name;
            thumb.appendChild(img);
          }
        });
      }
    });
  }

  window.previewFile = async function(id) {
    const meta = appData.files.find(f => f.id === id);
    if (!meta) return;
    const url = await getFileObjectURL(meta);
    if (!url) return alert('讀取檔案失敗，可能已被瀏覽器清除');
    window.open(url, '_blank');
  };

  window.deleteFile = async function(id) {
    if (!confirm('確定刪除此文件？')) return;
    if (fileUrlCache.has(id)) {
      URL.revokeObjectURL(fileUrlCache.get(id));
      fileUrlCache.delete(id);
    }
    try { await deleteFileFromDB(id); } catch (e) { console.warn(e); }
    appData.files = appData.files.filter(f => f.id !== id);
    saveData();
  };

  async function handleFileUpload(files) {
    if (!files || !files.length) return;
    let success = 0;
    for (const file of files) {
      if (file.size > 20 * 1024 * 1024) {
        alert(`檔案「${file.name}」超過 20MB，已跳過`);
        continue;
      }
      const id = 'file_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      try {
        await saveFileToDB(id, file);
        appData.files.push({
          id,
          name: file.name,
          type: file.type || '',
          size: file.size,
          uploadedAt: new Date().toLocaleString('zh-HK')
        });
        success++;
      } catch (e) {
        console.error(e);
        alert('儲存檔案失敗：' + file.name + '\n（可能瀏覽器不支援或空間不足）');
      }
    }
    if (success > 0) saveData();
  }

  // ---------- 渲染全部 ----------
  function renderAll() {
    renderDayTabs();
    renderItineraryList();
    renderExpenses();
    updateRateDisplay();
    renderHistory();
    renderFiles();

    document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
    const activeTab = appData.activeTab || 'itinerary';
    const target = document.getElementById(`tab-${activeTab}`);
    if (target) target.classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === activeTab);
    });
  }

  // ---------- 事件 ----------
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  document.getElementById('addItineraryBtn').addEventListener('click', addItinerary);

  document.getElementById('addDayBtn').addEventListener('click', function() {
    const el = document.getElementById('newDayName');
    const name = el.value.trim();
    if (!name) return alert('請輸入日期名稱');
    if (appData.days.some(d => d.name === name)) return alert('日期已存在');
    appData.days.push({ name, items: [] });
    appData.currentDay = name;
    el.value = '';
    saveData();
  });

  document.getElementById('addExpenseBtn').addEventListener('click', addExpense);

  document.getElementById('splitType').addEventListener('change', function() {
    const customDiv = document.getElementById('customSplitContainer');
    if (this.value === 'custom') customDiv.classList.remove('hidden');
    else customDiv.classList.add('hidden');
  });

  document.getElementById('settleAllBtn').addEventListener('click', settleAll);

  // 文件上載
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  if (uploadZone && fileInput) {
    uploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async function() {
      await handleFileUpload(Array.from(this.files || []));
      this.value = '';
    });
    // 拖放支援
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.background = '#f5ece2'; });
    uploadZone.addEventListener('dragleave', () => { uploadZone.style.background = ''; });
    uploadZone.addEventListener('drop', async e => {
      e.preventDefault();
      uploadZone.style.background = '';
      await handleFileUpload(Array.from(e.dataTransfer.files || []));
    });
  }

  // ---------- 啟動 ----------
  window.addEventListener('load', function() {
    loadData();
    initRateInputs();
    renderAll();
  });
</script>
</body>
</html>
